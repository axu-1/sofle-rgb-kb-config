name: Build Windows viewer
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test-and-publish:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Test and package
        shell: pwsh
        run: ./scripts/Publish-Windows.ps1 -Runtime ${{ matrix.runtime }}
      - uses: actions/upload-artifact@v4
        with:
          name: SofleStatus-${{ matrix.runtime }}
          path: artifacts/SofleStatus-${{ matrix.runtime }}.zip
